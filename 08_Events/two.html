<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>chai or code</h1>
    <button id="stop">Stop</button>
  </body>
  <script>
    //functions to be executed on events
    //settimeout function to stop the event after 5 seconds

    //handler is a caller
    // setTimeout(function(){

    //     console.log("Hitesh")
    // },2000) //2 second timeout

    const sayHitesh = function () {
      console.log("Hitesh");
    };

    const changeText = function () {
      document.querySelector("h1").innerHTML = "best js SERIES";
    };
    // setTimeout(sayHitesh,2000); //2 second timeout
    // setTimeout(changeText, 2000); //2 second timeout and this will change the text after 2 seconds from chai or code to best js SERIES
    //setTimeout is used to execute a function after a specified number of milliseconds

    //clearTimeout
    const changeMe = setTimeout(changeText, 2000);
 //clearTimeout is used to stop the execution of a function that was scheduled to be executed after a specified number of milliseconds
 //and it takes refrence
    document.querySelector("#stop").addEventListener("click", function () {
      clearTimeout(changeMe);
      console.log("STOPPED");  //we have succesfuly stopped the execution
    });
  </script>
</html>
